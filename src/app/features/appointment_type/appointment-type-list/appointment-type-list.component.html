<p-card header="Mes prestations" class="mb-3">
  <div class="flex justify-end mt-3">
    <button pButton label="Ajouter une prestation" icon="pi pi-plus" class="p-button-success" (click)="onAdd()"></button>
  </div>
  <p-table
    [value]="types"
    [paginator]="true"
    [rows]="6"
    [loading]="loading"
    [sortMode]="'multiple'"
    responsiveLayout="scroll"
    class="p-datatable-sm">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">Nom <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="default_duration">Durée <p-sortIcon field="default_duration"></p-sortIcon></th>
        <th pSortableColumn="priceDecimal">Prix <p-sortIcon field="priceDecimal"></p-sortIcon></th>
        <th pSortableColumn="description">Description <p-sortIcon field="description"></p-sortIcon></th>
        <th>Couleur</th>
        <th>Doubles RDV</th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-type>
      <tr>
        <td>{{ type.name }}</td>
        <td>{{ type.default_duration }} min</td>
        <td>{{ type.price.$numberDecimal }} €</td>
        <td>{{ type.description }}</td>
        <td>
          <div
            [style.backgroundColor]="type.color"
            [title]="type.color"
            style="width: 1.5rem; height: 1.5rem; border: 1px solid #ccc; border-radius: 0.25rem;"
          ></div>
        </td>
        <td>
          <p-tag
            [value]="type.allowMultipleBookings ? 'Oui' : 'Non'"
            [severity]="type.allowMultipleBookings ? 'success' : 'danger'">
          </p-tag>
        </td>
        <td >
          <button pButton icon="pi pi-pencil" class=" p-button-text p-button-rounded justify-content-center" (click)="onEdit(type._id)"></button>
          <button pButton icon="pi pi-trash" class=" p-button-text p-button-rounded p-button-danger justify-content-center" (click)="confirmDelete(type._id)"></button>
        </td>
      </tr>
    </ng-template>

  </p-table>


</p-card>

<p-confirmDialog></p-confirmDialog>
